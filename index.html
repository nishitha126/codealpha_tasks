<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator | Nishitha</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* ---------- Colors (change these to restyle the calculator) ---------- */
    :root {
      --ink: #16213a;
      --paper: #f6f7fb;
      --key: #26345a;
      --teal: #0e8f83;
      --amber: #f0a030;
      --light: #e9edf7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--paper);
      font-family: "Bricolage Grotesque", "Segoe UI", sans-serif;
      color: var(--ink);
    }

    h1 { margin: 0; font-size: 28px; }
    .hint { margin: 0; font-size: 14px; color: #566078; }

    /* The calculator body */
    .calc {
      width: min(92vw, 340px);
      padding: 18px;
      border-radius: 18px;
      background: var(--ink);
      box-shadow: 0 16px 36px rgba(22, 33, 58, 0.25);
    }

    /* Display screen: small line = earlier number and operator, big line = current number */
    .screen {
      padding: 10px 14px 14px;
      margin-bottom: 16px;
      border-radius: 10px;
      background: #0f1830;
      text-align: right;
      overflow-x: auto;
    }
    .screen .history { min-height: 22px; font-size: 16px; color: #8d9bbd; }
    .screen .result { font-size: 38px; font-weight: 700; color: #fff; white-space: nowrap; }

    /* Keys are laid out in a 4-column grid */
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

    button {
      padding: 16px 0;
      border: none;
      border-radius: 10px;
      background: var(--key);
      color: #fff;
      font-family: inherit;
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.12s, background 0.2s;
    }
    button:hover { background: #34467a; transform: translateY(-2px); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

    button.op { background: var(--teal); }
    button.op:hover { background: #12a89a; }
    button.clear { background: var(--light); color: var(--ink); }
    button.clear:hover { background: #fff; }
    button.equals { background: var(--amber); color: var(--ink); grid-row: span 2; }
    button.equals:hover { background: #ffb64a; }
    button.zero { grid-column: span 2; }
  </style>
</head>
<body>

  <h1>Calculator</h1>

  <div class="calc">
    <div class="screen">
      <div class="history" id="history"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="keys" id="keys">
      <button class="clear" data-action="clear">C</button>
      <button class="clear" data-action="back">&#9003;</button>
      <button class="op" data-op="÷">÷</button>
      <button class="op" data-op="×">×</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="op" data-op="−">−</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="op" data-op="+">+</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="equals" data-action="equals">=</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="dot">.</button>
    </div>
  </div>

  <p class="hint">You can also use your keyboard: 0-9, + - * /, Enter, Backspace, Esc</p>

  <script>
    // ---------- The calculator's memory ----------
    let current = "0";      // number being typed (shown in big line)
    let previous = null;    // number typed before the operator
    let operator = null;    // + − × ÷
    let fresh = false;      // true = next digit starts a new number
    let error = false;      // true after dividing by zero

    const resultEl = document.getElementById("result");
    const historyEl = document.getElementById("history");

    // Shows the memory values on the screen
    function render() {
      resultEl.textContent = current;
      historyEl.textContent = operator ? previous + " " + operator : "";
    }

    function clearAll() {
      current = "0"; previous = null; operator = null; fresh = false; error = false;
    }

    function inputDigit(d) {
      if (error) clearAll();
      if (fresh) { current = d; fresh = false; }
      else if (current.length < 12) { current = current === "0" ? d : current + d; }
    }

    function inputDot() {
      if (error) clearAll();
      if (fresh) { current = "0."; fresh = false; }
      else if (!current.includes(".")) { current += "."; }
    }

    // Does the actual maths: previous (operator) current
    function compute() {
      const a = parseFloat(previous);
      const b = parseFloat(current);
      let answer;
      if (operator === "+") answer = a + b;
      if (operator === "−") answer = a - b;
      if (operator === "×") answer = a * b;
      if (operator === "÷") {
        if (b === 0) {
          current = "Cannot divide by 0";
          previous = null; operator = null; error = true;
          return;
        }
        answer = a / b;
      }
      current = String(Number(answer.toPrecision(12)));  // removes tiny errors like 0.30000000000000004
      previous = null;
      operator = null;
    }

    function chooseOperator(op) {
      if (error) clearAll();
      if (operator && !fresh) compute();   // 5 + 3 + : calculates 8 first
      if (error) return;
      previous = current;
      operator = op;
      fresh = true;
    }

    function equals() {
      if (error || !operator) return;
      compute();
      fresh = true;
    }

    function backspace() {
      if (error) { clearAll(); return; }
      if (fresh) return;
      const tooShort = current.length <= 1 || (current.length === 2 && current[0] === "-");
      current = tooShort ? "0" : current.slice(0, -1);
    }

    // ---------- Mouse clicks ----------
    document.getElementById("keys").addEventListener("click", function (e) {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.digit) inputDigit(b.dataset.digit);
      else if (b.dataset.op) chooseOperator(b.dataset.op);
      else if (b.dataset.action === "dot") inputDot();
      else if (b.dataset.action === "equals") equals();
      else if (b.dataset.action === "back") backspace();
      else if (b.dataset.action === "clear") clearAll();
      render();
    });

    // ---------- Keyboard support ----------
    document.addEventListener("keydown", function (e) {
      const k = e.key;
      if (k >= "0" && k <= "9") inputDigit(k);
      else if (k === ".") inputDot();
      else if (k === "+") chooseOperator("+");
      else if (k === "-") chooseOperator("−");
      else if (k === "*") chooseOperator("×");
      else if (k === "/") { e.preventDefault(); chooseOperator("÷"); }
      else if (k === "Enter" || k === "=") { e.preventDefault(); equals(); }
      else if (k === "Backspace") backspace();
      else if (k === "Escape") clearAll();
      else return;
      render();
    });
  </script>

</body>
</html>
